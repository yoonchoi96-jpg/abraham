name: Abraham V5.6 Smoke Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Bootstrap 10 Readwise documents
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
        run: python scripts/bootstrap_readwise_db.py --db /tmp/readwise_pipeline.db --limit 10
      - name: Run V5.6 against 10 documents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ABRAHAM_DB_PATH: /tmp/readwise_pipeline.db
          ABRAHAM_VAULT_PATH: ${{ github.workspace }}/smoke_vault
          ABRAHAM_REPORT_DIR: ${{ github.workspace }}/smoke_reports
          ABRAHAM_KOREAN_CACHE_PATH: ${{ github.workspace }}/smoke_reports/korean_cache.json
          ABRAHAM_LOG_DIR: ${{ github.workspace }}/smoke_reports/logs
          ABRAHAM_BACKUP_PATH: ${{ github.workspace }}/smoke_reports/backups
          ABRAHAM_SCHEDULE_KST: "00:00,09:00,17:00"
        run: python run_v560_storage.py --apply --limit 10
      - name: Smoke assertions
        run: |
          set -euo pipefail
          test -s /tmp/readwise_pipeline.db
          report=$(find smoke_reports -name 'readwise_auto_v5.6_*.json' -print -quit)
          test -n "$report"
          python - "$report" <<'PY'
import json, sys
data=json.load(open(sys.argv[1], encoding="utf-8"))
assert data["version"] == "5.6.0"
gate=data["reader_color_gate"]
assert all(k in gate for k in ("white","red","orange","yellow","green","blue","navy","purple","gold"))
assert data["statistics"]["sqlite_documents"] == 10
print("Smoke gate:", gate)
print("Smoke rating pending:", data["incremental"]["rating_pending"])
print("Smoke Korean pending:", data["incremental"]["korean_pending"])
PY
