name: Hendrix Validate

on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest
      - name: Run Hendrix tests
        run: python -m pytest -q tests/test_obsidian_manager.py
