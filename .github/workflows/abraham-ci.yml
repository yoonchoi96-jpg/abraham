name: Abraham V5.6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abraham-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            run_v560_storage.py \
            abraham_sqlite.py \
            abraham_incremental.py \
            abraham_storage.py             scripts/sync_readwise.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate CLI schedule
        run: python run_v560_storage.py --print-schedule
