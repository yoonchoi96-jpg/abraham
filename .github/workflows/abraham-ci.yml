name: Abraham V5 CI

"on":
  push:
    paths:
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile active V5 Python
        run: |
          set -euo pipefail
          python -m py_compile abraham_incremental.py abraham_sqlite.py abraham_storage.py deepseek_adapter.py run_v560_storage.py scripts/*.py tests/*.py
      - name: Run regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
