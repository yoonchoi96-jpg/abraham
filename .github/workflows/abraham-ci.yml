name: Abraham V5 CI

"on":
  push:
    paths:
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
