name: Abraham V5.6.3 Cloud Pipeline

"on":
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abraham-state-pipeline
  cancel-in-progress: false

jobs:
  abraham:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pytest

      - name: Run regression tests
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q tests

      - name: Ensure state release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view state-current >/dev/null 2>&1; then
            gh release create state-current \
              --title "Abraham current state" \
              --notes "Mutable state assets for the Abraham GitHub-hosted pipeline."
          fi

      - name: Restore latest SQLite state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release download state-current --pattern readwise_pipeline.db --dir data --clobber; then
            echo "Restored existing SQLite state."
          else
            echo "No prior SQLite state asset found; initializing from repository state."
            if [ -f readwise_pipeline.db ]; then
              cp readwise_pipeline.db data/readwise_pipeline.db
            else
              echo "No SQLite state is available." >&2
              exit 1
            fi
          fi
          test -s data/readwise_pipeline.db
          .venv/bin/python scripts/verify_state.py --db data/readwise_pipeline.db

      - name: Restore latest Obsidian vault state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p vault
          if gh release download state-current --pattern abraham-vault.tar.gz --dir . --clobber; then
            tar -xzf abraham-vault.tar.gz -C vault
            echo "Restored prior vault state."
          else
            echo "No prior vault asset found; starting with an empty cloud vault."
          fi

      - name: Entity / Relation drain
        env:
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
          ABRAHAM_VAULT_PATH: ${{ github.workspace }}/vault
          ABRAHAM_REPORT_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports
          ABRAHAM_LOG_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports/logs
          ABRAHAM_BACKUP_PATH: ${{ github.workspace }}/90_Dashboard/auto_reports/backups
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_ENTITY_RELATION_MODEL: gemini-3.8-flash
          ENTITY_RELATION_BATCH_SIZE: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          .venv/bin/python scripts/entity_relation_drain.py --apply --limit 1000

      - name: Persist graph state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/verify_state.py --db data/readwise_pipeline.db
          gh release upload state-current data/readwise_pipeline.db --clobber

      - name: Run parallel Rating + Translation + downstream pipeline
        env:
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
          ABRAHAM_VAULT_PATH: ${{ github.workspace }}/vault
          ABRAHAM_REPORT_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports
          ABRAHAM_LOG_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports/logs
          ABRAHAM_BACKUP_PATH: ${{ github.workspace }}/90_Dashboard/auto_reports/backups
          MODEL: deepseek-flash
          GEMINI_RATING_MODEL: gemini-3.8-flash
          GEMINI_ENTITY_RELATION_MODEL: gemini-3.8-flash
          ENTITY_RELATION_BATCH_SIZE: "20"
          ABRAHAM_PARALLEL_AI: "1"
          ABRAHAM_AI_MAX_WORKERS: "4"
          ABRAHAM_TRANSLATION_WORKERS: "4"
          KOREAN_BATCH_SIZE: "80"
          ABRAHAM_BATCH_LIMIT: "1000"
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          .venv/bin/python run_v560_storage.py --apply --limit 1000

      - name: Persist SQLite and vault state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s data/readwise_pipeline.db ]; then
            .venv/bin/python scripts/verify_state.py --db data/readwise_pipeline.db
            gh release upload state-current data/readwise_pipeline.db --clobber
          fi
          if [ -d vault ]; then
            tar -czf abraham-vault.tar.gz -C vault .
            gh release upload state-current abraham-vault.tar.gz --clobber
          fi

      - name: Upload diagnostics and vault snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abraham-v5.6.3-${{ github.run_id }}
          path: |
            90_Dashboard/auto_reports/
            abraham-vault.tar.gz
          if-no-files-found: ignore
