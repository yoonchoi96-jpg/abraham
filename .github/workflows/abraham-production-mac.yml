name: Abraham V5.6.3 Production Mac

"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum uncached documents for this run"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: abraham-production-mac
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: [self-hosted, macOS, abraham-mac]
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up local Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests

      - name: Check local Obsidian REST API
        env:
          OBSIDIAN_API_URL: https://127.0.0.1:27124
          OBSIDIAN_API_KEY: ${{ secrets.OBSIDIAN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OBSIDIAN_API_KEY}" || { echo "Missing OBSIDIAN_API_KEY"; exit 1; }
          python - <<'PY'
          import json, os, ssl, urllib.request
          url = os.environ["OBSIDIAN_API_URL"].rstrip("/") + "/"
          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {os.environ['OBSIDIAN_API_KEY']}"},
          )
          with urllib.request.urlopen(
              req, timeout=30, context=ssl._create_unverified_context()
          ) as response:
              payload = json.loads(response.read().decode())
              assert response.status == 200
              assert payload.get("service") == "Obsidian Local REST API"
          print("Local Obsidian REST API reachable.")
          PY

      - name: Restore SQLite state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          gh release download state-current --pattern readwise_pipeline.db --dir data --clobber
          test -s data/readwise_pipeline.db
          python scripts/verify_state.py --db data/readwise_pipeline.db

      - name: Sync Readwise Reader
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
        run: python scripts/sync_readwise.py --db data/readwise_pipeline.db --max-documents 1000 --lookback-minutes 10

      - name: Persist synced SQLite state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s data/readwise_pipeline.db
          gh release upload state-current data/readwise_pipeline.db --clobber

      - name: Run Abraham
        id: abraham
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OBSIDIAN_API_URL: https://127.0.0.1:27124
          OBSIDIAN_API_KEY: ${{ secrets.OBSIDIAN_API_KEY }}
          MODEL: deepseek-flash
          GEMINI_RATING_MODEL: gemini-3.6-flash
          DEEPSEEK_THINKING: disabled
          DEEPSEEK_MAX_TOKENS: "32768"
          DEEPSEEK_MAX_RETRIES: "4"
          KOREAN_BATCH_SIZE: "80"
          ABRAHAM_KOREAN_TARGET_CHARS: "40000"
          ABRAHAM_KOREAN_MIN_BATCH: "4"
          ABRAHAM_KOREAN_MAX_BATCH: "80"
          ABRAHAM_TRANSLATION_WORKERS: "4"
          ABRAHAM_PARALLEL_AI: "1"
          ABRAHAM_AI_MAX_WORKERS: "4"
          ABRAHAM_TRANSLATION_THINKING: disabled
          ABRAHAM_TRANSLATION_MAX_TOKENS: "32768"
          ABRAHAM_RATING_THINKING: disabled
          ABRAHAM_RATING_MAX_TOKENS: "16384"
          ENTITY_RELATION_BATCH_SIZE: "20"
          DEEPSEEK_ENTITY_RELATION_MODEL: "deepseek-flash"
          ABRAHAM_ENTITY_RELATION_THINKING: disabled
          ABRAHAM_ENTITY_RELATION_MAX_TOKENS: "16384"
          ABRAHAM_MIN_RELATION_CONFIDENCE: "0.80"
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
          ABRAHAM_REPORT_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports
          ABRAHAM_LOG_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports/logs
          ABRAHAM_BACKUP_PATH: ${{ github.workspace }}/90_Dashboard/auto_reports/backups
          ABRAHAM_SCHEDULE_KST: "00:00,03:00,06:00,09:00,12:00,15:00,18:00,21:00"
          ABRAHAM_BATCH_LIMIT: "120"
          PYTHONUNBUFFERED: "1"
        run: |
          limit="${{ inputs.limit }}"
          if [ -z "${limit}" ]; then
            limit="${ABRAHAM_BATCH_LIMIT}"
          fi
          if [ -z "${limit}" ]; then
            limit="120"
          fi
          echo "Workload limit: ${limit} documents"
          echo "Bounded drain mode: every scheduled run reaches Entity/Relation/Apply for its completed slice."
          python run_v560_storage.py --apply --limit "${limit}"

      - name: Persist partial SQLite state
        if: always() && steps.abraham.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s data/readwise_pipeline.db
          python scripts/verify_state.py --db data/readwise_pipeline.db
          gh release upload state-current data/readwise_pipeline.db --clobber
          echo "PARTIAL_STATE_PERSISTED_AFTER_ABRAHAM"
      - name: Run V6-V9 intelligence
        if: steps.abraham.outcome == 'success'
        env:
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
        run: python run_v6_v8.py --mode autonomous --limit 250

      - name: Validate final SQLite state
        if: steps.abraham.outcome == 'success'
        run: python scripts/verify_state.py --db data/readwise_pipeline.db

      - name: Refresh persistent state release
        if: steps.abraham.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view state-current >/dev/null 2>&1; then
            gh release upload state-current data/readwise_pipeline.db --clobber
          else
            gh release create state-current data/readwise_pipeline.db --title "Abraham SQLite State" --notes "Rolling persistent SQLite state for Abraham V5.6.3."
          fi

      - name: Fail if Abraham failed after state persistence
        if: always() && steps.abraham.outcome == 'failure'
        run: |
          echo "Abraham failed, but partial SQLite state was persisted safely."
          exit 1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abraham-v5.6.3-mac-${{ github.run_id }}
          path: 90_Dashboard/auto_reports/
          if-no-files-found: ignore
