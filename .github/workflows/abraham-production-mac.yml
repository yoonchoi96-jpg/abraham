name: Abraham V5.6.3 Obsidian Mac Sync

"on":
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abraham-state-pipeline
  cancel-in-progress: false

jobs:
  obsidian:
    runs-on: [ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up local Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run regression tests
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest -q tests

      - name: Check local Obsidian REST API
        env:
          OBSIDIAN_API_URL: https://127.0.0.1:27124
          OBSIDIAN_API_KEY: ${{ secrets.OBSIDIAN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OBSIDIAN_API_KEY}"
          .venv/bin/python - <<'PY'
          import json, os, ssl, urllib.request
          req=urllib.request.Request(
              os.environ["OBSIDIAN_API_URL"].rstrip("/") + "/",
              headers={"Authorization": f"Bearer {os.environ['OBSIDIAN_API_KEY']}"}
          )
          with urllib.request.urlopen(req,timeout=30,context=ssl._create_unverified_context()) as r:
              p=json.loads(r.read().decode())
              assert r.status==200 and p.get("service")=="Obsidian Local REST API"
          print("Local Obsidian REST API reachable.")
          PY

      - name: Restore latest core SQLite state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          gh release download state-current --pattern readwise_pipeline.db --dir data --clobber
          test -s data/readwise_pipeline.db
          .venv/bin/python scripts/verify_state.py --db data/readwise_pipeline.db

      - name: Apply pending Obsidian renders
        id: obsidian_apply
        continue-on-error: true
        env:
          OBSIDIAN_API_URL: https://127.0.0.1:27124
          OBSIDIAN_API_KEY: ${{ secrets.OBSIDIAN_API_KEY }}
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
          ABRAHAM_REPORT_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports
          ABRAHAM_LOG_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports/logs
          ABRAHAM_BACKUP_PATH: ${{ github.workspace }}/90_Dashboard/auto_reports/backups
          ABRAHAM_OBSIDIAN_SYNC_PATH: "/Users/w/Desktop/Invest/Invest Insight"
          ABRAHAM_BATCH_LIMIT: "1000"
          ABRAHAM_PARALLEL_AI: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "Applying pending render stages from the latest cloud SQLite state."
          .venv/bin/python run_v560_storage.py --apply --limit 1000

      - name: Persist Obsidian render state
        if: always() && steps.obsidian_apply.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s data/readwise_pipeline.db
          .venv/bin/python scripts/verify_state.py --db data/readwise_pipeline.db
          gh release upload state-current data/readwise_pipeline.db --clobber

      - name: Push Obsidian changes through Headless Sync
        if: always() && steps.obsidian_apply.outcome != 'cancelled'
        env:
          ABRAHAM_OBSIDIAN_SYNC_PATH: "/Users/w/Desktop/Invest/Invest Insight"
        run: |
          set -euo pipefail
          command -v ob
          echo "=== Obsidian Headless local vaults ==="
          ob sync-list-local
          echo "=== Obsidian Sync status before push ==="
          ob sync-status --path "${ABRAHAM_OBSIDIAN_SYNC_PATH}" --json
          echo "=== Running one-shot Obsidian Sync ==="
          ob sync --path "${ABRAHAM_OBSIDIAN_SYNC_PATH}"
          echo "=== Obsidian Sync status after push ==="
          ob sync-status --path "${ABRAHAM_OBSIDIAN_SYNC_PATH}" --json

      - name: Fail if Obsidian apply failed
        if: always() && steps.obsidian_apply.outcome == 'failure'
        run: |
          echo "Obsidian apply failed, but the latest core SQLite state remains persisted."
          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abraham-v5.6.3-obsidian-${{ github.run_id }}
          path: 90_Dashboard/auto_reports/
          if-no-files-found: ignore
