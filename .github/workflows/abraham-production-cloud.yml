name: Abraham V5.6.1 Production Cloud

"on":
  schedule:
    - cron: "0 0,8,15 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum uncached documents for this run"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: abraham-production
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Obsidian CLI
        run: npm install --global obsidian-headless

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Security gate
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/\${{ github.repository }}" --jq '.private')" = "true"

      - name: Prepare runtime
        run: mkdir -p data vault 90_Dashboard/auto_reports

      - name: Restore Obsidian Sync vault
        env:
          OBSIDIAN_AUTH_TOKEN: \${{ secrets.OBSIDIAN_AUTH_TOKEN }}
          OBSIDIAN_VAULT_NAME: \${{ secrets.OBSIDIAN_VAULT_NAME }}
          OBSIDIAN_SYNC_PASSWORD: \${{ secrets.OBSIDIAN_SYNC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${OBSIDIAN_SYNC_PASSWORD}" ]; then
            ob sync-setup --vault "${OBSIDIAN_VAULT_NAME}" --path "${GITHUB_WORKSPACE}/vault" --device-name "abraham-github-actions" --password "${OBSIDIAN_SYNC_PASSWORD}" || true
          else
            ob sync-setup --vault "${OBSIDIAN_VAULT_NAME}" --path "${GITHUB_WORKSPACE}/vault" --device-name "abraham-github-actions" || true
          fi
          ob sync-config --path "${GITHUB_WORKSPACE}/vault" --mode bidirectional --conflict-strategy merge
          ob sync --path "${GITHUB_WORKSPACE}/vault"

      - name: Restore SQLite state
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh release download state-current --pattern readwise_pipeline.db --dir data --clobber
          test -s data/readwise_pipeline.db
          python scripts/verify_state.py --db data/readwise_pipeline.db

      - name: Sync Readwise Reader
        env:
          READWISE_TOKEN: \${{ secrets.READWISE_TOKEN }}
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
        run: python scripts/sync_readwise.py --db data/readwise_pipeline.db --max-documents 1000 --lookback-minutes 10

      - name: Run Abraham
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          ABRAHAM_DB_PATH: ${{ github.workspace }}/data/readwise_pipeline.db
          ABRAHAM_VAULT_PATH: ${{ github.workspace }}/vault
          ABRAHAM_REPORT_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports
          ABRAHAM_LOG_DIR: ${{ github.workspace }}/90_Dashboard/auto_reports/logs
          ABRAHAM_BACKUP_PATH: ${{ github.workspace }}/90_Dashboard/auto_reports/backups
          ABRAHAM_SCHEDULE_KST: "00:00,09:00,17:00"
        run: |
          limit="${{ inputs.limit }}"
          if [ -z "${limit}" ]; then limit="300"; fi
          python run_v560_storage.py --apply --limit "${limit}"

      - name: Push vault through Obsidian Sync
        env:
          OBSIDIAN_AUTH_TOKEN: \${{ secrets.OBSIDIAN_AUTH_TOKEN }}
          OBSIDIAN_VAULT_NAME: \${{ secrets.OBSIDIAN_VAULT_NAME }}
          OBSIDIAN_SYNC_PASSWORD: \${{ secrets.OBSIDIAN_SYNC_PASSWORD }}
        run: |
          set -euo pipefail
          ob sync-config --path "${GITHUB_WORKSPACE}/vault" --mode bidirectional --conflict-strategy merge
          ob sync --path "${GITHUB_WORKSPACE}/vault"

      - name: Validate final SQLite state
        run: python scripts/verify_state.py --db data/readwise_pipeline.db

      - name: Refresh persistent state release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view state-current >/dev/null 2>&1; then
            gh release upload state-current data/readwise_pipeline.db --clobber
          else
            gh release create state-current data/readwise_pipeline.db --title "Abraham SQLite State" --notes "Rolling persistent SQLite state for Abraham V5.6.1."
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abraham-v5.6.1-${{ github.run_id }}
          path: 90_Dashboard/auto_reports/
          if-no-files-found: ignore
