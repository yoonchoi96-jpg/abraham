name: Reader intake zero-cost validation
"on":
  pull_request:
    paths:
      - "scripts/reader_*.py"
      - "reader_colors.py"
      - "requirements-reader.txt"
      - "tests/test_reader_*.py"
      - "evals/reader/**"
      - ".github/workflows/reader-intake*.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-intake-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READER_PUBLIC_STANDARD_RUNNER: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install safe metadata parser
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-reader.txt
      - name: Verify deduplication, isolation, source preservation and guards
        run: python3 scripts/reader_intake_test.py
      - name: Extension regression tests (synthetic, no inference)
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_reader_*.py tests/test_color_rules.py
      - name: Benchmark multilingual title-index retrieval (synthetic, offline)
        run: python3 -m scripts.reader_novelty_benchmark --docs 10000 --trials 7
      - name: Benchmark advisory cross-language LSH (synthetic, offline)
        run: python3 -m scripts.reader_crosslingual_benchmark --docs 10000 --trials 5
      - name: Full 1000-document multilingual novelty stress (offline, no paid API)
        run: python3 -m scripts.reader_novelty_stress --documents 1000
      - name: Process real synthetic ZIP larger than 3 GiB and rerun it
        run: python3 scripts/reader_intake_test.py --large
      # No cache, artifact upload, dataset commits, cloud resources, or AI secrets.
